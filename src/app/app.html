<header class="site-header">
  <a class="brand" routerLink="/">Z kim mi po drodze</a>
  @if (auth.ready()) {
    <nav class="account" aria-label="Konto">
      @if (auth.user(); as user) {
        <span class="who" data-testid="user-email">{{ user.email }}</span>
        <button type="button" class="link" data-action="logout" (click)="logout()">Wyloguj</button>
      } @else {
        <a routerLink="/logowanie">Zaloguj się</a>
        <a routerLink="/rejestracja">Załóż konto</a>
      }
    </nav>
  }
</header>
<main class="content">
  <router-outlet />
</main>
<footer class="site-footer">
  <a routerLink="/regulamin">Regulamin</a>
  <a routerLink="/polityka-prywatnosci">Polityka Prywatności</a>
</footer>
