# Production deploy to vh.pl over SSH/rsync, in place. See context/deployment/deploy-plan.md.
#
# Manual trigger only (auto-deploy after merge comes later, once this is stable).
# Runs in the GitHub environment `production`, so these live there, not in the repo:
#   secrets   VHPL_HOST, VHPL_USER, VHPL_SSH_KEY (dedicated deploy key), VHPL_KNOWN_HOSTS (pinned host key line),
#             VHPL_SPA_DIR     the subdomain's document root, e.g. /home/<user>/quiz-site/live
#             VHPL_API_DIR     the Node app root registered in cPanel, e.g. /home/<user>/quiz-api/app
#             VHPL_NODE_ACTIVATE  absolute path to that app's `bin/activate` (shown at the top of "Setup
#                              Node.js App"; it is named after VHPL_API_DIR). A non-interactive SSH shell
#                              has no `node`/`npm` on PATH without it.
#             VHPL_DB_HOST, VHPL_DB_USER, VHPL_DB_PASSWORD, VHPL_DB_NAME  database credentials for the
#                              migration step only (the DB_* set in cPanel are not visible to a
#                              non-interactive SSH shell). They reach the host over stdin, never argv.
#   variable  VHPL_SITE_URL, e.g. https://quiz.demokratia.pl. When set, the run ends with a smoke check of
#             /api/health, /api/health/db and a SPA deep link.
#
# Migrations: api/migrations/ is mirrored to the host (with --delete) and `node migrate.js` applies pending
# files before the API restarts, so a schema change ships with a normal deploy. A failed migration fails the job.
# A rollback target without api/migrations/ skips the migration steps, and one without api/db.js skips the DB
# smoke check. Rollback never undoes applied migrations, so keep them backward-compatible.
#
# Why in place (no releases/ + current symlink): the cPanel Node selector records the RESOLVED path of the
# app root and names its virtualenv after it, so a symlink that moves between releases leaves the app
# pinned to the first release. Docroot and app root are fixed directories that cPanel is pointed at once.
#
# Rollback = run this workflow with `rollback_to`: that commit is checked out, rebuilt and deployed again
# (minutes, not atomic). The target commit must contain deploy/vhpl/ and api/.
#
# Paths cPanel manages inside the targets are protected from rsync: /api/ in the docroot holds the
# Passenger config and DB_* variables (never copy that file into the repo), /.well-known/ is used for
# certificate renewal, and the app root keeps node_modules (a link into the Node virtualenv), tmp/ and
# stderr.log. The API sync does not use --delete for the same reason.

name: Deploy to vh.pl (manual)

on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Commit SHA (40 chars) to build and deploy instead of the triggering commit. Leave empty to deploy this commit.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: vhpl-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VHPL_HOST: ${{ secrets.VHPL_HOST }}
      VHPL_USER: ${{ secrets.VHPL_USER }}
      VHPL_SPA_DIR: ${{ secrets.VHPL_SPA_DIR }}
      VHPL_API_DIR: ${{ secrets.VHPL_API_DIR }}
      VHPL_NODE_ACTIVATE: ${{ secrets.VHPL_NODE_ACTIVATE }}
      ROLLBACK_TO: ${{ inputs.rollback_to }}
    steps:
      - name: Validate inputs and secrets
        env:
          VHPL_SSH_KEY: ${{ secrets.VHPL_SSH_KEY }}
          VHPL_KNOWN_HOSTS: ${{ secrets.VHPL_KNOWN_HOSTS }}
          VHPL_DB_HOST: ${{ secrets.VHPL_DB_HOST }}
          VHPL_DB_USER: ${{ secrets.VHPL_DB_USER }}
          VHPL_DB_PASSWORD: ${{ secrets.VHPL_DB_PASSWORD }}
          VHPL_DB_NAME: ${{ secrets.VHPL_DB_NAME }}
        run: |
          set -euo pipefail
          if [ -n "$ROLLBACK_TO" ] && ! [[ "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]]; then
            echo "rollback_to must be a 40-char commit SHA" >&2
            exit 1
          fi
          for name in VHPL_HOST VHPL_USER VHPL_SSH_KEY VHPL_KNOWN_HOSTS VHPL_SPA_DIR VHPL_API_DIR VHPL_NODE_ACTIVATE VHPL_DB_HOST VHPL_DB_USER VHPL_DB_PASSWORD VHPL_DB_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name" >&2
              exit 1
            fi
          done
          # rsync --delete runs against VHPL_SPA_DIR: refuse anything that is not an absolute path at
          # least two levels below /home/<user>, so a typo cannot point it at the home directory.
          path_re='^/home/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          for name in VHPL_SPA_DIR VHPL_API_DIR; do
            if ! [[ "${!name}" =~ $path_re ]]; then
              echo "$name must be an absolute path at least two levels below /home/<user>, without a trailing slash" >&2
              exit 1
            fi
          done
          if [ "$VHPL_SPA_DIR" = "$VHPL_API_DIR" ] || [[ "$VHPL_SPA_DIR" == "$VHPL_API_DIR"/* ]] || [[ "$VHPL_API_DIR" == "$VHPL_SPA_DIR"/* ]]; then
            echo "VHPL_SPA_DIR and VHPL_API_DIR must be separate, non-nested directories" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_to || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build SPA
        run: |
          set -euo pipefail
          test -f deploy/vhpl/.htaccess || { echo "deploy/vhpl/ is missing in this commit" >&2; exit 1; }
          test -f api/app.js || { echo "api/ is missing in this commit" >&2; exit 1; }
          npm ci
          npm run build
          cp deploy/vhpl/.htaccess dist/z-kim-mi-po-drodze/browser/.htaccess

      - name: Configure SSH
        env:
          VHPL_SSH_KEY: ${{ secrets.VHPL_SSH_KEY }}
          VHPL_KNOWN_HOSTS: ${{ secrets.VHPL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VHPL_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VHPL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host vhpl"
            echo "  HostName $VHPL_HOST"
            echo "  User $VHPL_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config

      - name: Check target directories exist on the host
        run: |
          set -euo pipefail
          ssh vhpl bash -s -- "$VHPL_SPA_DIR" "$VHPL_API_DIR" <<'REMOTE'
          set -euo pipefail
          test -d "$1" || { echo "SPA dir is missing: it must already be the subdomain document root" >&2; exit 1; }
          test -d "$2" || { echo "API dir is missing: register the Node app in cPanel first" >&2; exit 1; }
          REMOTE

      - name: Sync SPA into the document root
        run: |
          set -euo pipefail
          rsync -azs --delete \
            --exclude /api/ --exclude /.well-known/ --exclude /cgi-bin/ --exclude /error_log \
            dist/z-kim-mi-po-drodze/browser/ "vhpl:$VHPL_SPA_DIR/"

      - name: Sync API into the app root
        run: |
          set -euo pipefail
          rsync -azs \
            --exclude /node_modules --exclude /tmp --exclude /stderr.log \
            api/ "vhpl:$VHPL_API_DIR/"

      - name: Sync migrations folder
        run: |
          set -euo pipefail
          # A rollback target from before migrations existed has no api/migrations/: nothing to sync.
          if [ ! -d api/migrations ]; then
            echo "api/migrations/ is absent in this commit; skipping the migrations sync"
            exit 0
          fi
          # Exact mirror (--delete) of the migrations only, so a removed or renamed file does not linger
          # on the host. The API sync above deliberately has no --delete.
          rsync -azs --delete api/migrations/ "vhpl:$VHPL_API_DIR/migrations/"

      - name: Install API dependencies on the host
        run: |
          set -euo pipefail
          # `npm install`, not `npm ci`: `npm ci` deletes node_modules, which cPanel links to the
          # Node virtualenv. The activate script may reference unset variables, so `set -u` comes after it.
          ssh vhpl bash -s -- "$VHPL_API_DIR" "$VHPL_NODE_ACTIVATE" <<'REMOTE'
          set -eo pipefail
          source "$2"
          set -u
          node --version
          cd "$1"
          npm install --omit=dev --no-audit --no-fund
          REMOTE

      - name: Apply database migrations
        env:
          VHPL_DB_HOST: ${{ secrets.VHPL_DB_HOST }}
          VHPL_DB_USER: ${{ secrets.VHPL_DB_USER }}
          VHPL_DB_PASSWORD: ${{ secrets.VHPL_DB_PASSWORD }}
          VHPL_DB_NAME: ${{ secrets.VHPL_DB_NAME }}
        run: |
          set -euo pipefail
          # A rollback target from before migrations existed has nothing to apply.
          if [ ! -d api/migrations ]; then
            echo "api/migrations/ is absent in this commit; skipping migrations"
            exit 0
          fi
          # No shell tracing here. The DB_* variables set in cPanel are not visible to a non-interactive SSH
          # shell, so the credentials travel on stdin: one stream = `export DB_X=<%q-quoted value>` lines
          # followed by the remote script. Nothing goes into argv, and nothing echoes the export lines.
          {
            for pair in DB_HOST:VHPL_DB_HOST DB_USER:VHPL_DB_USER DB_PASSWORD:VHPL_DB_PASSWORD DB_NAME:VHPL_DB_NAME; do
              src=${pair#*:}
              printf 'export %s=%q\n' "${pair%%:*}" "${!src}"
            done
            cat <<'REMOTE'
          set -eo pipefail
          source "$2"
          set -u
          cd "$1"
          node migrate.js </dev/null
          REMOTE
          } | ssh vhpl bash -s -- "$VHPL_API_DIR" "$VHPL_NODE_ACTIVATE"

      - name: Restart API
        run: |
          set -euo pipefail
          # Passenger convention for restarting the app; confirm with uptimeSeconds in /api/health.
          ssh vhpl bash -s -- "$VHPL_API_DIR" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$1/tmp"
          touch "$1/tmp/restart.txt"
          REMOTE
          echo "Deployed commit ${ROLLBACK_TO:-$GITHUB_SHA}"

      - name: Smoke check
        if: vars.VHPL_SITE_URL != ''
        env:
          SITE_URL: ${{ vars.VHPL_SITE_URL }}
        run: |
          set -euo pipefail
          sleep 5
          body=$(curl -fsS --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL%/}/api/health")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          # Commits from before the DB probe existed (rollback targets) have no /api/health/db.
          if [ -f api/db.js ]; then
            db_body=$(curl -fsS --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL%/}/api/health/db")
            echo "$db_body"
            echo "$db_body" | grep -q '"db":"up"'
          else
            echo "api/db.js is absent in this commit; skipping the DB check"
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL%/}/quiz/1")
          echo "SPA deep link: HTTP $code"
          [ "$code" = "200" ]
          # Commits from before the quiz API existed (rollback targets) have no api/quiz-data.js.
          # GET only: the smoke test never posts answers.
          if [ -f api/quiz-data.js ]; then
            quizzes=$(curl -fsS --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL%/}/api/quizzes")
            echo "$quizzes" | cut -c1-200
            echo "$quizzes" | grep -q '"id":'
          else
            echo "api/quiz-data.js is absent in this commit; skipping the quiz API check"
          fi
